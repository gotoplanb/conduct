# SonarQube project config for Conduct. Scan via `make sonar-scan`.
# Host URL + token are passed at scan time via env vars, not committed here.

sonar.projectKey=conduct
sonar.projectName=Conduct
sonar.projectVersion=0.1.0

# Source roots. Tests are listed separately so SonarQube knows to apply
# test-specific rules to them (e.g. allow assert statements, ignore some
# code smells that are fine in tests).
sonar.sources=.
sonar.tests=tests

# Exclusions — anything that shouldn't be analyzed for quality / security:
# - vendored / generated code (venv, caches)
# - non-Python or non-source artifacts (templates, prompts, voices, output)
# - alembic versions (auto-generated migrations; rules don't apply cleanly)
sonar.exclusions=\
  .venv/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  .pytest_cache/**,\
  .ruff_cache/**,\
  .mypy_cache/**,\
  alembic/versions/**,\
  templates/**,\
  prompts/**,\
  voices/**,\
  output/**,\
  tests/**,\
  htmlcov/**,\
  build/**,\
  dist/**,\
  *.egg-info/**,\
  .env,\
  .env.*,\
  .coverage,\
  coverage.xml,\
  **/.DS_Store

# Skip duplicate-code detection on tests — repetitive fixture setup is fine.
sonar.cpd.exclusions=tests/**

sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# pytest-cov writes coverage.xml at the repo root via `make sonar-scan`.
# Cobertura format is what SonarQube expects for Python.
sonar.python.coverage.reportPaths=coverage.xml

# Disable SCM blame collection — the scanner-in-Docker stalls indefinitely
# on the SCM Publisher step against Docker-Desktop-mounted volumes on macOS
# (file-timestamp quirk in the bind mount). We lose author/blame info in
# the SonarQube UI but everything else (issues, code smells, security
# hotspots, coverage) still works.
sonar.scm.disabled=true
