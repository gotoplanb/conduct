services:
  postgres:
    image: postgres:16-alpine
    container_name: conduct-postgres
    environment:
      POSTGRES_USER: conduct
      POSTGRES_PASSWORD: conduct
      POSTGRES_DB: conduct
    ports:
      - "5432:5432"
    volumes:
      - conduct-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduct"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: conduct-redis
    ports:
      - "6379:6379"
    volumes:
      - conduct-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: conduct:local
    container_name: conduct-api
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://conduct:conduct@postgres:5432/conduct
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4317
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: conduct:local
    container_name: conduct-worker
    command: ["python", "-m", "worker.queue"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://conduct:conduct@postgres:5432/conduct
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4317
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  conduct-postgres-data:
  conduct-redis-data:
