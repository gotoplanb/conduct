[project]
name = "conduct"
version = "0.1.0"
description = "LLM dispatch service — routes AI workloads to local or cloud models"
license = "MIT-0"
license-files = ["LICENSE"]
authors = [{ name = "Dave Stanton" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.1",
    "httpx>=0.27",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "rq>=2.0",
    "redis>=5.2",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "tenacity>=9.0",
    "piper-tts>=1.4",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "mcp>=1.2",
    "cryptography>=42.0",
    "aioboto3>=13.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-rust>=0.24.2",
]

[project.scripts]
conduct = "scripts.cli:main"

[build-system]
# Hatchling is the lightest backend that lets `[project.scripts]` resolve.
# The "force-include" map below keeps the existing top-level layout (no
# `src/` move) by telling hatch which directories belong in the wheel.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# We're an app, not a published library — just enough modules to make the
# `conduct` console script importable.
packages = ["scripts"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "fakeredis>=2.26",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses these as default-value markers; not actual mutable defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
omit = [
    ".venv/*",
    "tests/*",
    "alembic/versions/*",
    "scripts/*",
    "main.py",
    "lifespan.py",
]
branch = true
# Write paths relative to the project root so the coverage.xml file is
# portable between the host (where it's generated) and the scanner container
# (where SonarQube reads it). Without this, the XML carries the absolute
# host path and the in-container scanner can't match files.
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
