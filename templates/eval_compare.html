{% extends "base.html" %}
{% block title %}Eval — Conduct{% endblock %}
{% block content %}
<div x-data="{ task_type: '{{ task_type }}', days: '{{ days }}' }">
  <div class="flex items-center justify-between mb-6 gap-4 flex-wrap">
    <h1 class="text-2xl font-semibold">Eval — per-model rollup</h1>
    <a :href="'/ui/eval/review?task_type=' + task_type" class="text-sm text-zinc-400 hover:text-zinc-100">Review &amp; score →</a>
  </div>

  <form
    hx-get="/ui/eval/partial"
    hx-target="#eval-table"
    hx-trigger="change from:select"
    hx-include="this"
    hx-swap="innerHTML"
    class="flex flex-wrap gap-3 mb-4 items-end"
  >
    <div>
      <label class="block text-xs uppercase text-zinc-500 mb-1">Task type</label>
      <select name="task_type" x-model="task_type"
              class="bg-zinc-900 border border-zinc-700 rounded-md px-3 py-1.5 text-sm">
        {% for tt in task_types %}
        <option value="{{ tt }}">{{ tt }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-xs uppercase text-zinc-500 mb-1">Window</label>
      <select name="days" x-model="days"
              class="bg-zinc-900 border border-zinc-700 rounded-md px-3 py-1.5 text-sm">
        <option value="1">1 day</option>
        <option value="7">7 days</option>
        <option value="30">30 days</option>
        <option value="90">90 days</option>
      </select>
    </div>
    <div class="htmx-indicator text-sm text-zinc-500 self-end pb-1">loading…</div>
  </form>

  <div id="eval-table" class="rounded-lg border border-zinc-800 overflow-hidden">
    {% include '_eval_table.html' %}
  </div>
</div>
{% endblock %}
