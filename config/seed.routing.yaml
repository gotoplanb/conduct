# Starter routing rules — applied idempotently by `make seed`. Existing rules
# are not overwritten. Edit live via `PUT /routing/{task_type}` (admin auth);
# changes hot-reload because the route reads the rule from the DB on every job.
#
# `sensitivity` here is a floor — clients can request stricter, never looser.
#
# `eval_shadow_models` (optional) — candidate models replayed on real jobs for
# A/B eval. Each entry: {model, rate (0-1 sampling fraction),
# daily_cost_cap_usd (optional, cloud only)}. Cloud shadows are skipped on
# internal/confidential jobs unless the client opts in; local models always run.
#
# Sizing strategy: each task picks a primary sized for its complexity, with
# same-class shadows + one step-down + one step-up. That tells us whether the
# primary is under- or over-sized, not just "which big model is best".

rules:
  # Tiny task; testing whether <10B is enough vs a small step-up, plus a
  # cloud A/B across direct-API and Bedrock-hosted Anthropic so we can see
  # whether the same model picks up latency/quality drift via AWS.
  - task_type: dad_joke
    preferred_model: llama3.2:3b
    fallback_model: llama3.3:70b
    sensitivity: public
    max_tokens: 150
    notes: "Demo task; small-class primary, peers + step-up + cloud A/B across direct-API and Bedrock-hosted Anthropic."
    eval_shadow_models:
      - { model: gemma4:e2b, rate: 1.0 }
      - { model: qwen3.5:2b, rate: 1.0 }
      - { model: gemma4:e4b, rate: 1.0 }                                # step-up
      - { model: claude-haiku-4-5, rate: 1.0 }                          # direct API
      - { model: claude-sonnet-4-6, rate: 1.0 }                         # direct API
      - { model: us.anthropic.claude-haiku-4-5-20251001-v1:0, rate: 1.0 }   # Bedrock geo
      - { model: us.anthropic.claude-sonnet-4-6, rate: 1.0 }                # Bedrock geo

  # Lightweight classification — small primary, one step-down, one step-up.
  - task_type: email_classification
    preferred_model: qwen3.5:4b
    fallback_model: claude-haiku-4-5
    sensitivity: internal
    eval_shadow_models:
      - { model: gemma4:e4b, rate: 1.0 }
      - { model: mistral:7b, rate: 1.0 }
      - { model: llama3.2:3b, rate: 1.0 }    # step-down
      - { model: qwen3.5:9b, rate: 1.0 }     # step-up

  # Drafting needs more headroom than classify.
  - task_type: agenda_generation
    preferred_model: qwen3.5:9b
    fallback_model: claude-sonnet-4-6
    sensitivity: internal
    eval_shadow_models:
      - { model: gemma4:26b, rate: 1.0 }
      - { model: llama3.1:8b, rate: 1.0 }
      - { model: qwen3.5:4b, rate: 1.0 }     # step-down
      - { model: qwen3.5:27b, rate: 1.0 }    # step-up

  # Structured extraction benefits from a bit more reasoning.
  - task_type: email_extraction
    preferred_model: qwen3.5:9b
    fallback_model: claude-sonnet-4-6
    sensitivity: internal
    eval_shadow_models:
      - { model: mistral-small3.2, rate: 1.0 }
      - { model: gemma4:26b, rate: 1.0 }
      - { model: qwen3.5:4b, rate: 1.0 }     # step-down
      - { model: qwen3.5:27b, rate: 1.0 }    # step-up

  # Keep current 70b primary as the reference; eval whether a smaller mid-class
  # or a different large-class model produces equally usable bios.
  - task_type: bio_generation
    preferred_model: llama3.3:70b
    fallback_model: claude-sonnet-4-6
    sensitivity: internal
    eval_shadow_models:
      - { model: qwen3.5:35b, rate: 1.0 }
      - { model: gemma4:31b, rate: 1.0 }
      - { model: mistral-medium-3.5, rate: 1.0 }
      - { model: llama4:16x17b, rate: 1.0 }
      - { model: llama3.2:3b, rate: 1.0 }    # step-down (original Bosshardt eval)

  # Triage needs reasoning; mid-large primary with neighbors + a big step-up.
  - task_type: sre_triage
    preferred_model: qwen3.5:27b
    fallback_model: claude-sonnet-4-6
    sensitivity: internal
    eval_shadow_models:
      - { model: mistral-small3.2, rate: 1.0 }
      - { model: gemma4:31b, rate: 1.0 }
      - { model: qwen3.5:9b, rate: 1.0 }     # step-down
      - { model: llama3.3:70b, rate: 1.0 }   # step-up
      - { model: llama4:16x17b, rate: 1.0 }  # step-up

  # Confidential — local models only. Keep large primary; eval cheaper locals.
  - task_type: commission_audit
    preferred_model: llama3.3:70b
    fallback_model: llama3.3:70b
    sensitivity: confidential
    eval_shadow_models:
      - { model: qwen3.5:35b, rate: 1.0 }
      - { model: gemma4:31b, rate: 1.0 }
      - { model: llama4:16x17b, rate: 1.0 }
      - { model: qwen3.5:9b, rate: 1.0 }     # step-down
      - { model: mistral-medium-3.5, rate: 1.0 }  # alternate large

  # Confidential math — local only.
  - task_type: ledger_calculation
    preferred_model: llama3.3:70b
    fallback_model: llama3.3:70b
    sensitivity: confidential
    eval_shadow_models:
      - { model: qwen3.5:35b, rate: 1.0 }
      - { model: llama4:16x17b, rate: 1.0 }
      - { model: mistral-small3.2, rate: 1.0 }   # step-down

  - task_type: code_generation
    preferred_model: claude-sonnet-4-6
    fallback_model: claude-opus-4-5
    sensitivity: public
    # TODO: add cloud shadows once ANTHROPIC_API_KEY is configured.

  # The wander game splits work into two tasks: gen produces story scenarios,
  # eval judges the player's choices. Different model trade-offs per side —
  # gen wants narrative depth (bigger primary), eval wants per-turn latency
  # (smaller primary). Both stay local + Gemma-family, both runnable on a
  # MacBook Air. RESIDENT_MODELS must include both gemma4:e4b and gemma4:12b
  # so swapping between gen and eval doesn't pay reload cost. Cross-family
  # shadows can be added later once the pipeline is proven.
  - task_type: wander_gen
    preferred_model: gemma4:e4b
    fallback_model: gemma4:12b
    sensitivity: public
    max_tokens: 1200
    notes: "Story scenario generation for the wander game. e4b primary — in early game-side tests, gemma4:12b was slower AND wrapped structured output in ```json fences (breaks downstream parsing). 12b stays as shadow + fallback so we keep evaluating the trade."
    eval_shadow_models:
      - { model: gemma4:12b, rate: 1.0 }   # same-family step-up; watch for the fence-wrap regression

  - task_type: wander_eval
    preferred_model: gemma4:e4b
    fallback_model: gemma4:12b
    sensitivity: public
    max_tokens: 600
    notes: "Per-turn eval of player choices in the wander game. Small-model primary (latency matters at every turn); bigger Gemma as shadow + fallback."
    eval_shadow_models:
      - { model: gemma4:12b, rate: 1.0 }   # same-family step-up
