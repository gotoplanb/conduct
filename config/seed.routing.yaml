# Starter routing rules — applied idempotently by `make seed`. Existing rules
# are not overwritten. Edit live via `PUT /routing/{task_type}` (admin auth);
# changes hot-reload because the route reads the rule from the DB on every job.
#
# `sensitivity` here is a floor — clients can request stricter, never looser.
#
# `sampling` (optional, default `balanced`) — the task's generation profile,
# bundling temperature + seed policy:
#   deterministic — temp 0 + a seed derived from the input → same input, same
#     output (reproducible on local models; temp-0 best-effort on cloud).
#   balanced      — temp 0.7, random seed.
#   creative      — temp 1.0, random seed → same prompt, different output.
# Override per-request with the job's `sampling` field. Ignored by media tasks.
#
# `eval_shadow_models` (optional) — candidate models replayed on real jobs for
# A/B eval. Each entry: {model, rate (0-1 sampling fraction),
# daily_cost_cap_usd (optional, cloud only)}. Cloud shadows are skipped on
# internal/confidential jobs unless the client opts in; local models always run.
#
# Sizing strategy: each task picks a primary sized for its complexity, with
# same-class shadows + one step-down + one step-up. That tells us whether the
# primary is under- or over-sized, not just "which big model is best".

rules:
  # Tiny task; testing whether <10B is enough vs a small step-up, plus a
  # cloud A/B across direct-API and Bedrock-hosted Anthropic so we can see
  # whether the same model picks up latency/quality drift via AWS.
  - task_type: dad_joke
    preferred_model: llama3.2:3b
    fallback_model: llama3.3:70b
    sensitivity: public
    max_tokens: 150
    sampling: creative   # want a fresh joke every call, not the same one
    notes: "Demo task; small-class primary, peers + step-up + cloud A/B across direct-API and Bedrock-hosted Anthropic."
    eval_shadow_models:
      - { model: gemma4:e2b, rate: 1.0 }
      - { model: qwen3.5:2b, rate: 1.0 }
      - { model: gemma4:e4b, rate: 1.0 }                                # step-up
      - { model: claude-haiku-4-5, rate: 1.0 }                          # direct API
      - { model: claude-sonnet-4-6, rate: 1.0 }                         # direct API
      - { model: us.anthropic.claude-haiku-4-5-20251001-v1:0, rate: 1.0 }   # Bedrock geo
      - { model: us.anthropic.claude-sonnet-4-6, rate: 1.0 }                # Bedrock geo

  # Lightweight classification — small primary, one step-down, one step-up.
  - task_type: email_classification
    preferred_model: qwen3.5:4b
    fallback_model: claude-haiku-4-5
    sensitivity: internal
    sampling: deterministic   # stable labels for the same email
    eval_shadow_models:
      - { model: gemma4:e4b, rate: 1.0 }
      - { model: mistral:7b, rate: 1.0 }
      - { model: llama3.2:3b, rate: 1.0 }    # step-down
      - { model: qwen3.5:9b, rate: 1.0 }     # step-up

  # Drafting needs more headroom than classify.
  - task_type: agenda_generation
    preferred_model: qwen3.5:9b
    fallback_model: claude-sonnet-4-6
    sensitivity: internal
    eval_shadow_models:
      - { model: gemma4:26b, rate: 1.0 }
      - { model: llama3.1:8b, rate: 1.0 }
      - { model: qwen3.5:4b, rate: 1.0 }     # step-down
      - { model: qwen3.5:27b, rate: 1.0 }    # step-up

  # Structured extraction benefits from a bit more reasoning.
  - task_type: email_extraction
    preferred_model: qwen3.5:9b
    fallback_model: claude-sonnet-4-6
    sensitivity: internal
    sampling: deterministic   # structured extraction should be reproducible
    eval_shadow_models:
      - { model: mistral-small3.2, rate: 1.0 }
      - { model: gemma4:26b, rate: 1.0 }
      - { model: qwen3.5:4b, rate: 1.0 }     # step-down
      - { model: qwen3.5:27b, rate: 1.0 }    # step-up

  # Keep current 70b primary as the reference; eval whether a smaller mid-class
  # or a different large-class model produces equally usable bios.
  - task_type: bio_generation
    preferred_model: llama3.3:70b
    fallback_model: claude-sonnet-4-6
    sensitivity: internal
    sampling: deterministic   # same bio + context → consistent output (local model = real reproducibility)
    eval_shadow_models:
      - { model: qwen3.5:35b, rate: 1.0 }
      - { model: gemma4:31b, rate: 1.0 }
      - { model: mistral-medium-3.5, rate: 1.0 }
      - { model: llama4:16x17b, rate: 1.0 }
      - { model: llama3.2:3b, rate: 1.0 }    # step-down (original Bosshardt eval)

  # Triage needs reasoning; mid-large primary with neighbors + a big step-up.
  - task_type: sre_triage
    preferred_model: qwen3.5:27b
    fallback_model: claude-sonnet-4-6
    sensitivity: internal
    eval_shadow_models:
      - { model: mistral-small3.2, rate: 1.0 }
      - { model: gemma4:31b, rate: 1.0 }
      - { model: qwen3.5:9b, rate: 1.0 }     # step-down
      - { model: llama3.3:70b, rate: 1.0 }   # step-up
      - { model: llama4:16x17b, rate: 1.0 }  # step-up

  # Confidential — local models only. Keep large primary; eval cheaper locals.
  - task_type: commission_audit
    preferred_model: llama3.3:70b
    fallback_model: llama3.3:70b
    sensitivity: confidential
    eval_shadow_models:
      - { model: qwen3.5:35b, rate: 1.0 }
      - { model: gemma4:31b, rate: 1.0 }
      - { model: llama4:16x17b, rate: 1.0 }
      - { model: qwen3.5:9b, rate: 1.0 }     # step-down
      - { model: mistral-medium-3.5, rate: 1.0 }  # alternate large

  # Confidential math — local only.
  - task_type: ledger_calculation
    preferred_model: llama3.3:70b
    fallback_model: llama3.3:70b
    sensitivity: confidential
    sampling: deterministic   # math must be reproducible
    eval_shadow_models:
      - { model: qwen3.5:35b, rate: 1.0 }
      - { model: llama4:16x17b, rate: 1.0 }
      - { model: mistral-small3.2, rate: 1.0 }   # step-down

  - task_type: code_generation
    preferred_model: gemma4:e4b
    fallback_model: gemma4:12b
    sensitivity: public
    max_tokens: 4000
    notes: "Rust code-gen for the eval flywheel (#22) — LOCAL-ONLY research. Primary is gemma4:e4b, the empirical winner of bench v1 (wander#6 / #37): 95% compile + 4.70 avg golden over 20 specs, vs qwen3.5:9b's 60% / 2.70. gemma4:12b added as a shadow to settle bigger-gemma; qwen3.5:9b demoted to shadow (kept on the bench to see if its failures persist). Fenced multi-file output is the reliable contract for local models (not the JSON manifest, #36). Each candidate stores a Cargo artifact and gets code_eval'd, feeding composite DPO pairs (#31/#35). Fallback stays local (no cloud) per the local-only principle."
    eval_shadow_models:
      - { model: gemma4:12b, rate: 1.0 }    # NEW — e4b vs 12b head-to-head (#37)
      - { model: qwen3.5:9b, rate: 1.0 }    # demoted from primary; stays on the bench
      - { model: llama3.2:3b, rate: 1.0 }   # llama family

  # The wander game splits work into two tasks: gen produces story scenarios,
  # eval judges the player's choices. Different model trade-offs per side —
  # gen wants narrative depth (bigger primary), eval wants per-turn latency
  # (smaller primary). Both stay local + Gemma-family, both runnable on a
  # MacBook Air. RESIDENT_MODELS must include both gemma4:e4b and gemma4:12b
  # so swapping between gen and eval doesn't pay reload cost. Cross-family
  # shadows can be added later once the pipeline is proven.
  - task_type: wander_gen
    preferred_model: gemma4:e4b
    fallback_model: gemma4:12b
    sensitivity: public
    max_tokens: 1200
    notes: "Story scenario generation for the wander game. e4b primary — in early game-side tests, gemma4:12b was slower AND wrapped structured output in ```json fences (breaks downstream parsing). 12b stays as shadow + fallback so we keep evaluating the trade."
    eval_shadow_models:
      - { model: gemma4:12b, rate: 1.0 }   # same-family step-up; watch for the fence-wrap regression

  - task_type: wander_eval
    preferred_model: gemma4:e4b
    fallback_model: gemma4:12b
    sensitivity: public
    max_tokens: 600
    sampling: deterministic   # judge task: same scene+state+action → same verdict (reproducible rulings + clean DPO pairs, see #15/#16)
    notes: "Per-turn eval of player choices in the wander game. Small-model primary (latency matters at every turn); bigger Gemma as shadow + fallback."
    eval_shadow_models:
      - { model: gemma4:12b, rate: 1.0 }   # same-family step-up

  # LLM-as-a-judge (Phase 1: single-model pointwise). A `judge` job carries a
  # `target_job_id` in its inputs; the worker resolves that target's
  # prompt+response, scores it against this task's rubric (prompts/shared/
  # judge.md), and returns {score, rationale}. deterministic so the same target
  # always gets the same ruling. Small local model + internal floor keeps judging
  # cheap and keeps any internal/confidential target's content off cloud models.
  # See GitHub issue #17.
  - task_type: judge
    preferred_model: gemma4:e4b
    fallback_model: gemma4:e4b
    sensitivity: internal
    max_tokens: 400
    sampling: deterministic
    # For mode=panel, `eval_shadow_models` is repurposed as the JURY (judges
    # don't fan out shadows). preferred_model + these form the candidate panel;
    # the panel then drops the target's producer family (self-preference) and
    # any juror the target's sensitivity disallows. Pick DIVERSE families and,
    # ideally, RESIDENT_MODELS to avoid per-juror Ollama swaps.
    eval_shadow_models:
      - { model: llama3.2:3b, rate: 1.0 }   # llama family
      - { model: qwen3.5:4b, rate: 1.0 }    # qwen family
    notes: "LLM-as-judge (issue #17). mode=pointwise (default): target_job_id → {score,rationale}. mode=pairwise: target_job_id + against_job_id → order-swapped {chosen,rejected,tie}. mode=panel: jury (preferred + eval_shadow_models, minus producer-family + sensitivity-disallowed) each scores → median {score,n,disagreement}. optional apply_to_target writes back (quality-score lane for point/panel, pairwise_verdicts for pairwise)."

  # ===== Media task primitives =====
  # These four are the wander scene-pipeline primitives. Each one is
  # independent: the client orchestrates the chain by passing previous-job
  # output URLs into the next job's `inputs`. See docs/quickstart-ios-eval.md
  # for the pattern. media_kind drives the worker's dispatch path.

  - task_type: wander_scene_image
    preferred_model: wander_scene_image    # = comfy_workflows/wander_scene_image.json
    fallback_model: wander_scene_image
    sensitivity: public
    max_tokens: 1
    media_kind: image
    notes: "SDXL + Ghibli LoRA scene still. 1024x768. ~23s on M5 Max."

  - task_type: wander_scene_video
    preferred_model: wander_scene_video    # = comfy_workflows/wander_scene_video.json
    fallback_model: wander_scene_video
    sensitivity: public
    max_tokens: 1
    media_kind: video
    notes: "Wan 2.2 14B I2V FP16. Inputs require source_image_job_id. ~6 min for a 3s clip @ 720x480 on M5 Max."

  - task_type: wander_scene_music
    preferred_model: acestep-v15-xl-turbo  # ignored at dispatch; selected by provider config
    fallback_model: acestep-v15-xl-turbo
    sensitivity: public
    max_tokens: 1
    media_kind: audio
    notes: "ACE-Step 1.5 XL Turbo chiptune via MLX. ~23s for ~34s of audio after one-time init."

  - task_type: wander_scene_assemble
    preferred_model: ffmpeg                # cosmetic; the mux provider doesn't honor it
    fallback_model: ffmpeg
    sensitivity: public
    max_tokens: 1
    media_kind: mux
    notes: "FFmpeg mux. Inputs require source_video_job_id + source_audio_job_id. Sub-second."
