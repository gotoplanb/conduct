# Per-million-token pricing in USD. Edit and hot-reload both processes
# (API + worker) with:
#   make reload-pricing
# or directly:
#   docker kill --signal=USR1 conduct-api conduct-worker
#
# Local provider pricing is implicitly zero — omit them.
# Add entries when new cloud models are routed to.

anthropic:
  # Prompts up to 100K tokens; over that it's $0.50 / $2.50, which this
  # registry can't express. Verified against
  # https://platform.claude.com/docs/en/about-claude/pricing on 2026-11-04.
  claude-haiku-5-5:
    input_per_1m_usd: 0.10
    output_per_1m_usd: 0.50
  claude-haiku-4-5:
    input_per_1m_usd: 1.00
    output_per_1m_usd: 5.00
  claude-sonnet-4-6:
    input_per_1m_usd: 3.00
    output_per_1m_usd: 15.00
  claude-opus-4-5:
    input_per_1m_usd: 5.00
    output_per_1m_usd: 25.00

# AWS Bedrock — Claude 4.5/4.6 IDs. Verified against
# https://platform.claude.com/docs/en/about-claude/pricing on 2026-06-02.
# Bedrock's pricing structure for 4.5+ models: global endpoints (`global.…`)
# match direct-API rates; regional/geo endpoints (in-region flat ids + `us.`,
# `eu.`, `au.`, `jp.` profiles) carry a 10% premium. Each id Conduct routes
# to needs its own entry — there's no per-family glob in the registry.
bedrock:
  # Geo profiles — 10% premium over global / direct-API rates.
  us.anthropic.claude-sonnet-4-6:
    input_per_1m_usd: 3.30
    output_per_1m_usd: 16.50
  us.anthropic.claude-haiku-4-5-20251001-v1:0:
    input_per_1m_usd: 1.10
    output_per_1m_usd: 5.50
  # Global profiles — base rate, matches direct API.
  global.anthropic.claude-sonnet-4-6:
    input_per_1m_usd: 3.00
    output_per_1m_usd: 15.00
  global.anthropic.claude-haiku-4-5-20251001-v1:0:
    input_per_1m_usd: 1.00
    output_per_1m_usd: 5.00

# ElevenLabs TTS (#52) — billed per input character, not per token. Conduct
# records characters as tokens_in, so these are USD per 1M characters
# ($0.08 / 1K chars = $80 / 1M). Pay-as-you-go / overage rate; characters
# included in a subscription are effectively prepaid. Keyed by model_id
# (ELEVENLABS_MODEL_ID). Verified against https://elevenlabs.io/pricing/api
# on 2026-11-18.
elevenlabs:
  eleven_multilingual_v2:
    input_per_1m_usd: 80.00
    output_per_1m_usd: 0
  eleven_v3:
    input_per_1m_usd: 80.00
    output_per_1m_usd: 0
  eleven_flash_v2_5:
    input_per_1m_usd: 40.00
    output_per_1m_usd: 0
